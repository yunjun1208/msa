apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-ordering
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yunjun1208/msa.git
    targetRevision: main
    path: msa/ordering/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: soldesk
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: ordering-depl
      namespace: soldesk
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true