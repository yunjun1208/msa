apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-depl
  namespace: soldesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway-container
        image: 256187519952.dkr.ecr.ap-northeast-2.amazonaws.com/apigateway:REPLACE_WITH_CI_SHA
        ports:
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할수 있는 리소스의 최대치
          limits:
            cpu: "500m"
            memory: "500Mi"
        # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
          requests:
            cpu: "100m"
            memory: "250Mi"
        env:
        - name: APP_ALLOWED_ORIGIN
          value: 'https://server.aws-cisco.com'
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_ACCESS_SECRET
        # Readiness: API Gateway 트래픽 수신 준비 확인
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Liveness: API Gateway 정상 작동 확인
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3


---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  namespace: soldesk
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: apigateway