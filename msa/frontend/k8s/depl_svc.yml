apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-depl
  namespace: soldesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: 256187519952.dkr.ecr.ap-northeast-2.amazonaws.com/frontend-service:c48532ecc6305d4d65cddf10ba45eba472ae9c1a
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: soldesk
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-name: "msa-final-frontend-nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:ap-northeast-2:256187519952:certificate/47d75a99-ea85-4959-8bbf-3d18a6fec0bf"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "HTTP"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/"
    external-dns.kubernetes.io/hostname: "server.aws-cisco.com"
    external-dns.kubernetes.io/alias: "A"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  ports:
    - name: https
      port: 443
      targetPort: 80
      protocol: TCP
  selector:
    app: frontend
