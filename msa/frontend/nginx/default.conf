server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NLB operates at L4. HTTP API prefix routing is handled here.
    # No URI suffix on proxy_pass: keep /member-service/... etc for Spring Gateway.
    location ~ ^/(member-service|product-service|ordering-service)(/|$) {
        proxy_pass http://apigateway-service.soldesk.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
