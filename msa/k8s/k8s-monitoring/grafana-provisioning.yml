apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: prometheus
        uid: msa-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        version: 1
        jsonData:
          timeInterval: 20s
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: msa-gitops
        orgId: 1
        folder: MSA
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards