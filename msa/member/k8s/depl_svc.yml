apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-depl
  namespace: soldesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: member
    spec:
      containers:
      - name: member-container
        image: 256187519952.dkr.ecr.ap-northeast-2.amazonaws.com/member-service:80a9ab6f51be0f5a704dd41b98df356a59e4864c
        ports:
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할수 있는 리소스의 최대치
          limits:
            cpu: "500m"
            memory: "500Mi"
        # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
          requests:
            cpu: "100m"
            memory: "250Mi"
        env:
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: internal-service-secret
              key: INTERNAL_SERVICE_TOKEN
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: member-db-secret
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: member-db-secret
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: member-db-secret
              key: DB_NAME
        - name: DB_PW
          valueFrom:
            secretKeyRef:
              name: member-db-secret
              key: DB_PW
        # 컨테이너 상태 확인
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_ACCESS_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_REFRESH_SECRET
        - name: ADMIN_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: ADMIN_BOOTSTRAP_PASSWORD
        # Readiness: 요청을 받을 준비가 되었는지 확인
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 18
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Liveness: 애플리케이션 정상 작동 확인
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: soldesk
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: member
