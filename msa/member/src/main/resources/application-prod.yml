spring:
  config:
    activate:
      on-profile: prod
  application:
    name: member-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?sslMode=REQUIRED
    username: ${DB_USER}
    password: ${DB_PW}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true

jwt:
  expiration: 1000
  secretKey: ${JWT_ACCESS_SECRET}
  expirationRt: 288000
  secretKeyRt: ${JWT_REFRESH_SECRET}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN}

app:
  admin:
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
