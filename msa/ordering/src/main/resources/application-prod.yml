spring:
  config:
    activate:
      on-profile: prod
  application:
    name: ordering-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?sslMode=REQUIRED
    username: ${DB_USER}
    password: ${DB_PW}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true

app:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
  order-events:
    enabled: ${ORDER_EVENTS_ENABLED:false}
    topic-arn: ${ORDER_EVENTS_TOPIC_ARN:}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN}
