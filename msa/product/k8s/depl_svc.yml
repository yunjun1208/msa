apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-depl
  namespace: soldesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: product
    spec:
      serviceAccountName: product-sa
      containers:
        - name: product-container
          image: 256187519952.dkr.ecr.ap-northeast-2.amazonaws.com/product-service:6ce91cfbe3c3c1bc766c3a9aae4474dbba0192e6
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "500Mi"
            requests:
              cpu: "100m"
              memory: "250Mi"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: product-db-secret
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: product-db-secret
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: product-db-secret
                  key: DB_NAME
            - name: DB_PW
              valueFrom:
                secretKeyRef:
                  name: product-db-secret
                  key: DB_PW
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: INTERNAL_SERVICE_TOKEN
            - name: PRODUCT_IMAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: msa-runtime-config
                  key: PRODUCT_IMAGE_BUCKET
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: soldesk
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: product