spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  config:
    activate:
      on-profile: prod
  application:
    name: product-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?sslMode=REQUIRED
    username: ${DB_USER}
    password: ${DB_PW}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: ${PRODUCT_IMAGE_BUCKET}
internal:
  service-token: ${INTERNAL_SERVICE_TOKEN}
